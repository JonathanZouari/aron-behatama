<!DOCTYPE html>

<body class="bg-background min-h-screen flex items-center justify-center p-4 font-body text-text">

<h1 class="font-headline text-2xl font-bold text-walnut mb-2 tracking-tight">ארון בהתאמה · אזור הנגר</h1>
<p class="text-sm text-text-muted mb-8 max-w-[250px]">הגישה מיועדת לנגר מורשה בלבד. אין הרשמה עצמית.</p>
<!-- Error Banner -->
<div class="w-full bg-red-50 border border-error text-error rounded-lg p-3 mb-6 flex items-start gap-3 text-right" role="alert">
<span class="material-symbols-outlined shrink-0 mt-0.5">error</span>
<span class="text-sm font-medium">פרטי ההתחברות שגויים או שאין הרשאת נגר</span>
</div>
<!-- Login Form -->
<form action="#" class="w-full space-y-5 text-right" method="POST">
<div>
<label class="block text-sm font-medium text-text mb-1 font-label" for="email">דוא״ל</label>
<div class="relative">
<span class="absolute inset-y-0 right-0 flex items-center pr-3 pointer-events-none text-text-muted">
<span class="material-symbols-outlined text-lg">mail</span>
</span>
<input class="block w-full rounded-lg border-border pr-10 focus:border-primary focus:ring-primary sm:text-sm h-11 transition-colors" id="email" name="email" placeholder="mail@example.com" required="" type="email" value="carpenter@aron-behatama.co.il"/>
</div>
</div>
<div>
<label class="block text-sm font-medium text-text mb-1 font-label" for="password">סיסמה</label>
<div class="relative">
<span class="absolute inset-y-0 right-0 flex items-center pr-3 pointer-events-none text-text-muted">
<span class="material-symbols-outlined text-lg">lock</span>
</span>
<input class="block w-full rounded-lg border-error pr-10 focus:border-error focus:ring-error sm:text-sm h-11 transition-colors" id="password" name="password" placeholder="••••••••" required="" type="password"/>
<button aria-label="הצג סיסמה" class="absolute inset-y-0 left-0 flex items-center pl-3 text-text-muted hover:text-primary transition-colors focus:outline-none" type="button">
<span class="material-symbols-outlined text-lg">visibility</span>
</button>
</div>
</div>
<div class="pt-2">
<button class="w-full flex justify-center items-center gap-2 py-2.5 px-4 border border-transparent rounded-lg shadow-sm text-sm font-bold font-label text-on-primary bg-primary hover:bg-primary-hover focus:outline-none focus:ring-2 focus:ring-offset-2 focus:ring-primary transition-all h-[44px]" type="submit">

                        <span class="material-symbols-outlined text-[20px]">login</span>
</button>
</div>
</form>
<div class="w-full border-t border-border my-8 relative">
<span class="absolute top-1/2 left-1/2 -translate-x-1/2 -translate-y-1/2 bg-surface px-4 text-xs text-text-muted font-medium">או</span>
</div>
<!-- Demo Section -->
<div class="w-full bg-orange-50 border border-warning rounded-lg p-5 text-right relative overflow-hidden group">
<div class="absolute -right-4 -top-4 w-12 h-12 bg-warning/10 rounded-full blur-xl group-hover:bg-warning/20 transition-all duration-500"></div>
<div class="flex items-start gap-3 mb-4">
<span class="material-symbols-outlined text-warning shrink-0 mt-0.5">construction</span>
<div>

</div>
</div>

<span class="material-symbols-outlined text-[18px] group-hover:-translate-x-1 transition-transform">arrow_forward</span>
                חזרה לאתר הלקוחות
            </a>
</div>
